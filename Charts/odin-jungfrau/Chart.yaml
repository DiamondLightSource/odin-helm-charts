apiVersion: v2
name: odin-jungfrau
description: IOC and Odin deployment for Jungfrau

type: application
version: 0.2.0
home: https://github.com/diamondlightsource/odin-helm-charts
sources:
  - https://github.com/DiamondLightSource/odin-helm-charts/tree/main/Charts/jungfrau

dependencies:
  - name: ioc-instance
    version: 5.14.0
    repository: "oci://ghcr.io/epics-containers/charts"
    # ioc-instance is a library chart: lift its defaults (nested under its own
    # ioc-instance key) into this chart's .Values.ioc-instance
    import-values:
      - child: ioc-instance
        parent: ioc-instance
