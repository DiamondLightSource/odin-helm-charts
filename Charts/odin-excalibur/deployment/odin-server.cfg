[server]
debug_mode  = 0
http_port   = 8888
http_addr   = 0.0.0.0
adapters    = fp, fr, mw, excalibur

[tornado]
logging = error

{{- $fr_endpoints := list }}
{{- $fp_endpoints := list }}
{{- $detector_fems := list }}
{{- range $i := until (int .Values.odinDataCount) }}
  {{- $fr_endpoints = append $fr_endpoints (printf "%s-odin-data-%d:10000" $.Values.detectorName $i) }}
  {{- $fp_endpoints = append $fp_endpoints (printf "%s-odin-data-%d:10004" $.Values.detectorName $i) }}
  {{- $detector_fems = append $detector_fems (printf "192.168.0.%03d:6969" (add $i 101)) }}
{{- end }}

[adapter.fr]
module = odin_data.frame_receiver_adapter.FrameReceiverAdapter
endpoints = {{ join ", " $fr_endpoints }}
update_interval = 0.2

[adapter.fp]
module = odin_data.control.frame_processor_adapter.FrameProcessorAdapter
endpoints = {{ join ", " $fp_endpoints }}
update_interval = 0.2

[adapter.mw]
module = odin_data.control.meta_listener_adapter.MetaListenerAdapter
endpoints = {{ $.Values.detectorName }}-meta-writer:5659
update_interval = 0.5

[adapter.excalibur]
module = excalibur.adapter.ExcaliburAdapter
detector_fems = {{ join ", " $detector_fems }}
powercard_fem_idx = 1 
chip_enable_mask = 0xFF, 0xFF
update_interval = 0.5
