[server]
debug_mode  = 0
http_port   = 8888
http_addr   = 0.0.0.0
adapters    = fp, fr, mw, xspress

[tornado]
logging = error

{{- $fp_endpoints := list }}
{{- range $i := until (int .Values.odinDataCount) }}
  {{- $fp_endpoints = append $fp_endpoints (printf "%s-odin-data-%d:10004" $.Values.detectorName $i) }}
{{- end }}

[adapter.fp]
module = odin_data.control.frame_processor_adapter.FrameProcessorAdapter
endpoints = {{ join ", " $fp_endpoints }}
update_interval = 0.2

{{- $fr_endpoints := list }}
{{- range $i := until (int .Values.odinDataCount) }}
  {{- $fr_endpoints = append $fr_endpoints (printf "%s-odin-data-%d:10000" $.Values.detectorName $i) }}
{{- end }}

[adapter.fr]
module = odin_data.control.frame_receiver_adapter.FrameReceiverAdapter
endpoints = {{ join ", " $fr_endpoints }}
update_interval = 0.2

[adapter.mw]
module = odin_data.control.meta_listener_adapter.MetaListenerAdapter
endpoints = {{ .Values.detectorName }}-meta-writer:5659
update_interval = 0.5

{{- $daq_endpoints := list }}
{{- range $i := until (int .Values.odinDataCount) }}
  {{- $daq_endpoints = append $daq_endpoints (printf "tcp://*:%d" (add 15150 $i)) }}
{{- end }}

[adapter.xspress]
module = xspress_detector.control.adapter.XspressAdapter
endpoint = {{ .Values.detectorName }}-xspress-control:12000
num_cards = {{ .Values.numCards }}
num_tf = 16384
base_ip = 192.168.0.1
max_channels = {{ .Values.numChannels }}
max_spectra = 4096
settings_path = {{ .Values.settingsPath }}
run_flags = 2
debug = 1
num_process = {{ .Values.odinDataCount }}
daq_endpoints = {{ join ", " $daq_endpoints }}
fr_endpoints =  {{ join ", " $fr_endpoints }}
fp_endpoints =  {{ join ", " $fp_endpoints }}
