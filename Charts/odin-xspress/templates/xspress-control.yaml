{{- $enabled := eq .Values.global.enabled false | ternary false true -}}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: {{ .Values.detectorName }}-xspress-control
  labels:
    enabled: {{ $enabled | quote }}
spec:
  replicas: {{ $enabled | ternary 1 0 }}
  selector:
    matchLabels:
      app: {{ .Values.detectorName }}-xspress-control
  template:
    metadata:
      labels:
        app: {{ .Values.detectorName }}-xspress-control
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ .Values.detectorName }}-odin-config-volume
          configMap:
            name: {{ .Values.detectorName }}-odin-config
            defaultMode: 0755
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.devShmSize }}
      containers:
        - name: {{ .Values.detectorName }}-xspress-control
          image: {{ .Values.image }}
          command:
            - /odin/deployment/xspress-control.sh
          ports:
            - containerPort: 12000
          volumeMounts:
            - name: {{ .Values.detectorName }}-odin-config-volume
              mountPath: /odin/deployment
            - name: dev-shm
              mountPath: /dev/shm
          {{- with .Values.xspressControlResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      terminationGracePeriodSeconds: 3
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.detectorName }}-xspress-control
spec:
  selector:
    app: {{ .Values.detectorName }}-xspress-control
  ports:
    - name: {{ .Values.detectorName }}-xspress-control-ctrl
      protocol: TCP
      port: 12000
